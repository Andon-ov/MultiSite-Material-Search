<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Търсене на продукти</title>
  <style>
    body {
      font-family: "Helvetica Neue", sans-serif;
      background-color: #fffff;
      margin: 0;
      padding: 40px 10%;
      color: #333;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 32px;
      color: black;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 18px;
      margin: 0;
    }

    form {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      align-items: center;
    }

    form input[type="text"] {
      width: 350px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bbb;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
      margin-right: 15px;
    }

    form input[type="text"]:focus {
      border-color: #007bff;
      box-shadow: 0 2px 8px rgba(0,123,255,0.2);
      outline: none;
    }

    form button {
    padding: 12px 25px;
    border: white;
    color: black;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    }

    form button:hover {
      background-color: #007bff;
      color: white;
    }

    .stores {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }

    .store-card {
      background: #f5f5f5;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 16px;
      color: #000000;
      font-weight: bold;
      transition: all 0.3s;
      text-align: center;
      cursor: pointer;
    }

    .store-card:hover {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>Добре дошли в Material Scout</h1>
    <p>Уеб приложение за търсене и агрегиране на строителни материали от различни онлайн магазини</p>
  </header>

  <form action="{% url 'search_products' %}" method="get">
    <input type="text" name="query" placeholder="Търсете продукти..." required>
    <button type="submit">Търсене</button>
  </form>

  <div class="stores">
    <div class="store-card">Toplivo</div>
    <div class="store-card">Bricolage</div>
    <div class="store-card">Masterhaus</div>
    <div class="store-card">Praktiker</div>
  </div>
</body>
</html>
